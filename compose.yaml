services:
  # Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # API Flask
  api-backend:
    build: ./backend
    container_name: flask-api
    ports:
      - "5000:5000"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883

  # Simulador de Telemetria
  simulator:
    build: ./simulator
    container_name: mqtt-simulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883